[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-agent"
version = "0.1.0"
description = "Starter environment for a simulated billing support agent"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "openai>=1.66,<3",
    "python-dotenv>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["ops_agent", "benchmarks"]
